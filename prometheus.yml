global:
  scrape_interval: 15s

scrape_configs:
  # Spring Boot actuator on the app's management port (not exposed on the API port)
  - job_name: 'relayforge'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:9091']

  # RabbitMQ's built-in exporter: per-queue message counts (ready / unacked) incl. the DLQ
  - job_name: 'rabbitmq'
    metrics_path: '/metrics/detailed'
    params:
      family: ['queue_coarse_metrics']
    static_configs:
      - targets: ['rabbitmq:15692']
