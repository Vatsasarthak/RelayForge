# Local development stack. Copy .env.example to .env first; every variable used here is documented there.
# Infrastructure ports are bound to 127.0.0.1 only, so they are not reachable from other machines.
# Volume and network names are prefixed with the project name. Installations created before the rename to
# RelayForge used the project "notifyr": set COMPOSE_PROJECT_NAME=notifyr in .env to keep using their volumes
# (see README "Upgrading from Notifyr").
name: relayforge

services:
  postgres:
    image: postgres:16
    container_name: relayforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: relayforge_rabbitmq
    # RabbitMQ keeps its data per node name, which is derived from the hostname: keep it stable
    # (installations from before the rename set RABBITMQ_HOSTNAME=notifyr-rabbitmq to keep their broker data)
    hostname: ${RABBITMQ_HOSTNAME:-relayforge-rabbitmq}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"                 # AMQP protocol port
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"   # Management UI port
    volumes:
      # durable queues and persistent messages (incl. retries waiting for their delay) survive re-creation
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      # the diagnostics CLI starts an Erlang VM; 10 s was too short on a loaded machine
      timeout: 30s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: relayforge_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: relayforge-app:local
    container_name: relayforge_app
    restart: unless-stopped
    # matches spring.lifecycle.timeout-per-shutdown-phase so in-flight work can finish before SIGKILL
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
      # actuator (health, metrics) has its own port, reachable only from this machine
      - "127.0.0.1:${MANAGEMENT_PORT:-9091}:9091"
    environment:
      SERVER_PORT: 8080
      MANAGEMENT_PORT: 9091
      TZ: ${APP_TIMEZONE:-UTC}
      # inside the compose network the services are reached by name on their default ports
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      # true = email/SMS are only logged and end in status SIMULATED; set false with real credentials
      MOCK_PROVIDER: ${MOCK_PROVIDER:-true}
      MAIL_HOST: ${MAIL_HOST:-live.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-hello@demomailtrap.co}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      SIMULATE_FAILURE_RATE: ${SIMULATE_FAILURE_RATE:-0.0}
      PUSH_DELAY_MS: ${PUSH_DELAY_MS:-1000}
      MOCK_PROVIDER_DELAY_MS: ${MOCK_PROVIDER_DELAY_MS:-0}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-8}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      MAX_REQUEST_BODY_SIZE: ${MAX_REQUEST_BODY_SIZE:-1MB}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9091/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: relayforge_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: relayforge_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

volumes:
  postgres_data:
  rabbitmq_data:
